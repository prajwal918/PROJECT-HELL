version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-hell:latest
    container_name: project_hell_app
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 5s
      retries: 3